<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .social-links {
            list-style-type: none;
            padding: 0;
        }
        .social-links li {
            display: inline-block;
            margin: 10px 20px;
        }
        .social-links a {
            text-decoration: none;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .facebook { background-color: #3b5998; }
        .twitter { background-color: #1da1f2; }
        .instagram { background-color: #e1306c; }
        .linkedin { background-color: #0077b5; }
        .github { background-color: #333; }

        .social-links a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Connect with Us!</h1>
    <ul class="social-links">
        <li><a href="https://www.facebook.com" class="facebook" target="_blank">Facebook</a></li>
        <li><a href="https://www.twitter.com" class="twitter" target="_blank">Twitter</a></li>
        <li><a href="https://www.instagram.com" class="instagram" target="_blank">Instagram</a></li>
        <li><a href="https://www.linkedin.com" class="linkedin" target="_blank">LinkedIn</a></li>
        <li><a href="https://www.github.com" class="github" target="_blank">GitHub</a></li>
    </ul>
</body>
</html>
