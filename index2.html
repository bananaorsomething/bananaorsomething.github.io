<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mysterious Realm</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            overflow: hidden;
        }
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 5px #000;
        }
        #content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: fadeIn 2s;
        }
        #mysteryText {
            font-size: 2em;
            text-align: center;
            max-width: 600px;
            opacity: 0;
            animation: appear 5s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes appear {
            0% { opacity: 0; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            color: #bbb;
        }
        .glow {
            text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="glow">Welcome to the Mysterious Realm</h1>
    </header>
    <div id="content">
        <div id="mysteryText">
            <p>In the shadows of the unknown, where whispers of the past echo,</p>
            <p>lies a world veiled in secrets and stories yet untold.</p>
            <p>Will you dare to venture deeper?</p>
        </div>
    </div>
    <footer>
        <p>© 2025 Mysterious Realm. All rights reserved.</p>
        <p>Explore at your own risk...</p>
    </footer>
</body>
</html>
